[package]
name = "fundraiser"
version = "0.1.0"
description = "Trustless group fundraiser: goal reached -> only the recipient withdraws; goal missed -> every contributor reclaims their exact contribution."
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "fundraiser"

[features]
default = []
# Which USDC mint the program accepts. Neither = localnet (a test mint).
# Build with: anchor build -- --features devnet   (or mainnet)
devnet = []
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
